              particle: FLAME
              hit-particle: FLAME
              sound: ENTITY_FIREWORK_ROCKET_LAUNCH
              hit-sound: ENTITY_GENERIC_EXPLODE
    skills:
      left:
        type: melee_smash
        cooldown: 0
        params:
          display: '锤击'
          damage: 12.0
          range: 3.2
          angle: 55
          knockback: 0.4
          particle: SWEEP_ATTACK
          sound: ENTITY_PLAYER_ATTACK_STRONG
      right:
