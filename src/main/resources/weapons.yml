  # ======================================================== 乃依 · 弓（易伤标记）
  noi_bow:
    character: noi
    display: '<green>乃依之弓</green>'
    material: BOW
    model-data: 0
    lore:
      - '<gray>左键 / 右键 <white>原版蓄力射击'
