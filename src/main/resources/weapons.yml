# 竹取合战 · 武器定义（配置模板 v9）
#
# config-version = 配置模板版本（不是插件版本）。
# 插件升级时【不会覆盖】你的数值文件，所以模板更新后需要你自己同步：
#   备份并删除 plugins/TaketoriKassen/weapons.yml → 执行 /taketori reload 重新生成
# 启动时若检测到模板版本落后，控制台会明确提示。
config-version: 9
#
# 位移类技能（self_boost / rocket_jump）默认走【纯药水】boost-mode: potion：
#   SPEED        跑得更快（"推进"的持续感）
#   JUMP_BOOST   跳得更高
#   LEVITATION   自动上升（有向上分量的技能会启用；每级约 +0.05 格/tick，等级与 tick 可配）
#   全部是原版效果，不受位置纠正与反作弊影响；原版【没有】自动水平位移的药水，
#   所以水平方向表现为"跑得更快"，而不是"被推出去"。
#
# 备选路径（改一行 boost-mode 即可）：
#   teleport     逐 tick 传送：位移最确定，但观感硬，部分服务器的反作弊/领地插件会拦截
#   velocity     调 setVelocity：最平滑，但速度可能被位置纠正立刻清除
#
# 药水参数：
#   potion-ticks / potion-speed / potion-jump / potion-slow-falling
#   potion-levitation / potion-levitation-amplifier / potion-levitation-ticks
#
# 按键：左键 left / 右键 right / Shift+右键 shift-right / Q q
#
# ============================ 数值基准：穿全套铁甲的玩家 ============================
# 铁甲全套 = 15 点护甲 → 减伤 15/(15+8) ≈ 65.2%，即【实际伤害 ≈ 配置伤害 × 0.35】。
# 反推：想"对铁甲 N 击击杀"（20 血）→ 配置伤害 ≈ 20 / N × 2.87。
#
# ============================ 本次重做的重点：模式 = 玩法，不是数字 ============================
# 每个 Q 模式切换都必须改变"你该怎么打"：
#   辉夜：重锤（砸地击飞 + 火箭跳进场）↔ 火箭（远程范围压制，近战变弱）
#   帝　：近战（最高单击 + 震地击飞）↔ 远程（投掷，但近战被削弱）
#   雷　：防御（正常机动）↔ 壁垒（抗性更强，但给自己挂缓慢 = 用机动换硬度）
#   月镜：镜面（反射飞行物，专治远程）↔ 爆发（主动范围控制）
#   旗鱼：冰冻（减速）↔ 极寒（定身）
#
# 新增机制（详见 技能树.md）：
#   shockwave   360° 冲击 + 向上击飞        → 辉夜重锤左键、帝震地
#   rocket_jump 用爆炸把自己送出去           → 辉夜重锤右键
#   pull        把敌人拉向你（与钢丝牵引相反）→ 彩叶钢丝右键
#   reflect     把飞行物弹回发射者           → 月镜镜面模式
#   melee_smash 连击参数 combo-bonus         → 彩叶剑左键（连续命中叠伤）
#   projectile  定身参数 freeze-ticks        → 旗鱼极寒模式
#   special_shot 易伤标记 mark-bonus         → 乃依（标记目标，全队收益）
#
# 改完执行 /taketori reload。启动与重载时会自动校验参数键与名字。

weapons:

  # ======================================================== 辉夜 · 火箭锤
