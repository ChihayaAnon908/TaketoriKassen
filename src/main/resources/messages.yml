# 文案（MiniMessage 格式）。占位符使用 {name} 形式，避免与 MiniMessage 标签冲突。
prefix: '<gradient:#f5c26b:#f78fb3><bold>竹取合战</bold></gradient> <dark_gray>»</dark_gray> '

command:
  no-permission: '<red>你没有权限执行该指令。'
  player-only: '<red>该指令只能由玩家执行。'
  reloaded: '<green>配置已重载：<white>{weapons} 把武器<green>、<white>{characters} 个角色<green>。'
  reload-failed: '<red>配置重载失败，已保留上一份可用配置：<gray>{reason}'
  unknown-sub: '<red>未知子命令。<gray>用法：/taketori <reload|give|character|debug|play>'
  usage-give: '<gray>用法：/taketori give <player> <weaponId>'
  usage-character: '<gray>用法：/taketori character <player> <characterId|none>'
  weapon-not-found: '<red>找不到武器：<white>{id}'
  character-not-found: '<red>找不到角色：<white>{id}'
  player-not-found: '<red>找不到玩家：<white>{name}'
  given: '<green>已给予 <white>{player}</white> 武器 <white>{weapon}</white>。'
  character-set: '<green>已将 <white>{player}</white> 的角色设为 <white>{character}</white>，并发放对应武器。'
  character-cleared: '<green>已清除 <white>{player}</white> 的角色绑定与武器。'
  debug-on: '<green>调试模式已开启。'
  debug-off: '<yellow>调试模式已关闭。'
  debug-locked: '<yellow>调试模式未开启，请先在 config.yml 设置 debug: true 并执行 /taketori reload。'
  debug-header: '<gray>调试信息：<white>{info}'
  debug-runtime-on: '<green>调试模式已开启（本次运行有效）。按技能时控制台会打印 <white>[input] / [skill] / [combat]</white> 三类日志。'
  debug-runtime-off: '<yellow>调试模式已关闭。'
  debug-persist: '<gray>希望重启后仍生效，请修改 config.yml 的 <white>debug: true</white>。'
  doctor-header: '<gold>===== 竹取合战 自检 ====='
  doctor-line: '<gray>{line}'
  doctor-footer: '<gold>========================='
  mode-not-weapon: '<red>主手不是插件武器，无法切换模式。'
  mode-result: '<gray>Q 槽技能结果：<white>{result}</white><gray>（SUCCESS=已切换 / NOT_BOUND=该武器没绑定 Q 技能 / ON_COOLDOWN=冷却中）'
  mode-detail: '<gray>武器 <white>{weapon}</white><gray>　当前模式 <white>{mode}</white><gray>　多模式武器：<white>{hasModes}'
  skills-header: '<gold>===== 当前武器技能 ====='
  skills-line: '<gray>{slot} <dark_gray>|</dark_gray> <white>{name}</white> <dark_gray>|</dark_gray> {state}'
  skills-footer: '<gold>========================'
  skills-empty: '<gray>主手不是插件武器（用 /taketori character 领取，或 /taketori give）。'
  qmode-usage: '<gray>用法：/taketori qmode <drop|held-slot|none>，当前：<white>{current}'
  qmode-invalid: '<red>无效的值，可选：drop / held-slot / none'
  qmode-set: '<green>Q 键行为已设为 <white>{mode}</white>（本次运行有效）。'
  qmode-persist: '<gray>永久生效请修改 config.yml 的 <white>input.q-mode</white> 后 /taketori reload。'
  play-hint: '<gray>你的角色：<white>{character}</white><gray>，武器：<white>{weapons}'

input:
  on-cooldown: '<red>{skill}</red> <gray>冷却中：<white>{time}s'
  on-cooldown-bar: '<red>{skill}</red> <gray>{bar}</gray> <white>{time}s'
  no-character: '<red>你还没有绑定角色，请联系管理员使用 /taketori character。'
  wrong-weapon: '<red>该武器不属于你的角色。'
  mode-switched: '<gray>模式：<white>{mode}</white> <dark_gray>({id})'
  equip-switched: '<gray>已切换到 <white>{weapon}</white>'
  equip-missing: '<red>你身上没有 <white>{weapon}</white>，已为你补发。'
  special-shot-on: '<aqua>特殊射击：<green>开启'
  special-shot-off: '<aqua>特殊射击：<red>关闭'

skill:
  no-target: '<gray>没有可牵引的目标。'
  mirror-ready: '<light_purple>镜面展开：<white>{time}s'
  guard-ready: '<aqua>强化防御：<white>{time}s'
  grapple-miss: '<gray>钢丝落空。'
  boost-defly: '<yellow>已取消飞行状态（飞行时推进不会生效）'
  shockwave-none: '<gray>冲击波没有命中的目标（<white>{radius}</white> 格内没有敌人）'
  freeze-applied: '<aqua>已冻结 <white>{target}</white></aqua> <gray>{time}s'

# BedWars 式多房间匹配：大厅 → 匹配 → 房间等待区 → 倒计时开局（玻璃笼）→ 结算回大厅
room:
  # 匹配与进出
  join-success: '<green>已加入房间 <white>{room}</white>，正在前往等待区…'
  join-broadcast: '<gray>{player} 加入了房间 <dark_gray>(<white>{count}/{max}</white>)'
  leave: '<yellow>你已离开房间，正在返回大厅。'
  leave-broadcast: '<gray>{player} 离开了房间 <dark_gray>(<white>{count}/{max}</white>)'
  no-room: '<red>当前没有可加入的房间，请稍后再试或联系管理员配置场地。'
  room-full: '<red>房间 <white>{room}</white> 已经满员。'
  room-started: '<red>该房间已经开局，无法中途加入。<gray>可在房间列表选择旁观。'
  already-in: '<yellow>你已经在房间 <white>{room}</white> 里了。'
  not-in-room: '<gray>你当前不在任何房间里。'
  switch-room: '<gray>已从原房间切换到 <white>{room}</white>。'
  spectating: '<gray>你正在旁观房间 <white>{room}</white>。<gray>再次点击旁观者按钮可返回大厅。'
  # 倒计时
  countdown: '<gold>游戏将在 <white>{seconds} </white>秒后开始…'
  countdown-full: '<gold>人数已满！游戏将在 <white>{seconds} </white>秒后开始！'
  countdown-cancel: '<yellow>在线人数不足，开局倒计时已取消，继续等待其他玩家加入…'
  cage-hold: '<aqua>开局准备：<white>{seconds} </white>秒后玻璃笼解除，正式开战！'
  # 结算
  end-return: '<gray>对局结束，正在返回大厅…'
  # 房间列表 GUI
  list-title: '房间列表'
  list-quick-join: '<green>快速加入'
  list-quick-join-lore: '<gray>自动加入人最多的等待房间'
  list-leave: '<yellow>离开回大厅'
  list-status-waiting: '<aqua>等待中'
  list-status-starting: '<gold>倒计时 <white>{seconds}s'
  list-status-caged: '<light_purple>开局准备中'
  list-status-playing: '<red>游戏中 <gray>{time}'
  list-status-ending: '<gray>结算中'
  list-mode-pvp: '<red>PVP 红蓝对抗'
  list-mode-pve: '<blue>PVE 月人入侵'
  list-players: '<gray>人数 <white>{count}/{max}'
  list-click-join: '<green>▸ 点击加入该房间'
  list-click-spectate: '<aqua>▸ 点击旁观该房间'
  list-full: '<dark_gray>房间已满'
  list-disabled: '<dark_gray>房间未开放'
  list-not-ready: '<yellow>场地未就绪 <gray>({missing})'
  # 场地管理命令
  arena-created: '<green>已创建场地 <white>{id}</white> 并自动选中，开始用选区工具/指令划定吧。'
  arena-exists: '<red>场地 <white>{id}</white> 已存在。'
  arena-not-found: '<red>找不到场地：<white>{id}'
  arena-selected: '<green>当前操作场地：<white>{id}</white>（后续 set*/del* 都作用于它）'
  arena-not-selected: '<red>你还没有选中场地。<gray>先用 /taketori arena select <id> 或 create <id>。'
  arena-deleted: '<green>已删除场地 <white>{id}</white>。'
  arena-delete-busy: '<red>场地 <white>{id}</white> 的房间正在运行，无法删除（先 /taketori match stop {id}）。'
  arena-enabled: '<green>场地 <white>{id}</white> 已开放，匹配可以选中它。'
  arena-disabled: '<yellow>场地 <white>{id}</white> 已关闭，新的匹配不会再选中它。'
  arena-bad-id: '<red>场地 id 只能用小写字母、数字、下划线与横线（例如 map_1）。'
  arena-wait-set: '<green>已把 <white>{id}</white> 的等待出生点设为你的位置。<gray>用选区 + setwait 可设整片等待区。'
  # 动态房间（月之都制）
  creating-world: '<gray>月之都正在生成新的合战世界（模板 <white>{room}</white>）…'
  create-failed: '<red>世界生成失败：<white>{reason}'
  no-template: '<red>还没有可用的月面模板：请管理员把世界文件夹放入 <white>moonmaps/</white> 并用 /taketori moonmap 加载划定。'
  max-rooms: '<red>房间已达上限（<white>{max}</white>），请稍后再试或等待现有房间结束。'
  per-player-limit: '<red>你已拥有 <white>{max}</white> 个房间：先等待对局结束或删除房间后再创建。'
  moonmap-not-world: '<red>moonmaps/<white>{template}</white>/ 里找不到 level.dat——这不是一个世界文件夹（需含 level.dat 与 region/）。'
  template-not-ready: '<red>模板 <white>{template}</white> 未就绪：<gray>{missing}'
  template-missing: '<red>moonmaps 里找不到模板 <white>{template}</white> 的世界文件夹。<gray>把世界文件夹放进 moonmaps/，或用 <white>/taketori moonmap import <世界名> {template}</white> 导入服务器已有世界。'
  room-deleted: '<yellow>房间 <white>{room}</white> 已删除，世界已回收。'
  room-delete-denied: '<red>只有房主或管理员可以删除该房间（且仅等待中的房间）。'
  reinforced: '<green>已补位加入 <white>{room}</white>！对局装备已发放，直接参战。'
  moonmap-loading: '<gray>正在复制月面模板 <white>{template}</white> 到编辑世界…'
  moonmap-loaded: '<green>编辑世界 <white>{world}</white> 已加载（模板 {template}）。<gray>进入后用选区指令划定，完成后 /taketori moonmap unload {template}。'
  moonmap-unloaded: '<green>模板 <white>{template}</white> 已保存回 moonmaps 并卸载编辑世界。'
  moonmap-not-loaded: '<red>模板 <white>{template}</white> 的编辑世界尚未加载（先 /taketori moonmap load <模板名>）。'
  moonmap-busy: '<red>该模板正在处理中，请稍候再试。'
  moonmap-unloading: '<gray>正在保存并卸载编辑世界…'
  moonmap-writeback-failed: '<red>模板 <white>{template}</white> 写回 moonmaps 失败：编辑副本已转存 moonmap-recover/，<bold>请勿重载或重启</bold>——重新执行 <white>/taketori arena setup</white> 会自动恢复现场，再 setup done 收尾。'
  moonmap-backup-failed: '<red>模板 <white>{template}</white> 本次未写回，且转存 moonmap-recover/ 也失败——编辑副本仍在服务器根目录 <white>k_tpl_{template}</white>。<bold>请勿重载或重启</bold>（会被当残留清掉）：先把它改名去掉 <white>k_tpl_</white> 前缀（例如改成 <white>{template}_recover</white>），再手动整理进 <white>moonmaps/{template}</white>，最后重新 <white>/taketori arena setup</white> 载入并 setup done 收尾。'
  moonmap-recovered: '<yellow>检测到上次未写回的编辑副本，已恢复加载——确认无误后请 unload 保存。'
  moonmap-created: '<green>平坦模板 <white>{template}</white> 已生成到 moonmaps/。<gray>用 <white>/taketori moonmap load {template}</white> 进入编辑。'
  # 月面模板导入（moonmap import）
  import-started: '<gray>正在把服务器世界 <white>{world}</white> 复制为模板 <white>{id}</white>…'
  import-done: '<green>已导入模板 <white>{id}</white>，现在可以用 <white>/taketori arena setup {id}</white> 划定。'
  import-failed: '<red>模板导入失败：<white>{reason}'
  import-not-world: '<red>世界 <white>{world}</white> 不是有效的世界文件夹（容器里找不到它，或缺少 level.dat）。'
  import-exists: '<red>模板 <white>{id}</white> 已存在，本次未导入——如需重导请先删掉 moonmaps/{id}。'

party:
  invite-self: '<red>不能邀请你自己。'
  invite-sent: '<green>已向 <white>{player}</white> 发送派对邀请（60 秒内有效）。'
  invited: '<gold>{player} 邀请你加入派对<gray>（当前 {size}/{max} 人）。 <click:run_command:''/taketori party accept''><hover:show_text:''点击接受邀请''><green><bold>[接受]</bold></green></hover></click><dark_gray>（或输入 /taketori party accept）'
  full: '<red>派对已满（<white>{max}</white> 人），不能再邀请。'
  full-join: '<red>派对已经满员（<white>{max}</white> 人），无法加入。'
  target-in-party: '<red>{player} 已经在一个派对里了。'
  accepted: '<green>已加入派对。'
  already-in: '<yellow>你已经在一个派对里了（先 /taketori party leave）。'
  no-invite: '<red>你没有有效的派对邀请（过期或不存在；让对方再发一次）。'
  joined: '<gray>{player} 加入了派对 <dark_gray>(<white>{size}/{max}</white>)'
  leader-left: '<yellow>{player} 离开了，房主已转让给 <white>{new-leader}</white>。'
  member-left: '<gray>{player} 离开了派对 <dark_gray>(<white>{size}/{max}</white>)'
  kicked: '<gray>{player} 被请出了派对 <dark_gray>(<white>{size}/{max}</white>)'
  kicked-you: '<yellow>你被房主请出了派对。'
  kick-not-member: '<red>该玩家不在你的派对里。'
  not-leader: '<red>只有房主可以这样做。'
  disbanded: '<yellow>派对已解散。'
  list-none: '<gray>你当前不在派对里：<white>/taketori party invite <玩家></white> 发起组队。'
  list: '<gold>派对 <dark_gray>(房主 <white>{leader}</white>，{size}/{max} 人)：{members}'

rejoin:
  expired: '<red>重连时限已过，无法回到刚才的对局（背包已按断线快照返还）。'
  gone: '<red>刚才的对局已经结束或房间已回收，无法重连（背包已按断线快照返还）。'
  back: '<gray>{player} 重新连接回到了房间 <white>{room}</white>。'
  welcome: '<green>欢迎回来，已把你送回 <white>{room}</white> 的原队伍。'
  no-session: '<gray>没有可重连的对局（对局中掉线才会在时限内保留位置）。'

setup:
  already-active: '<yellow>你已经在场地划定会话中（<white>{id}</white>）——这是当前的剩余清单：'
  no-template: '<red>moonmaps/ 里找不到模板 <white>{template}</white> 的世界文件夹。<gray>先用 <white>/taketori moonmap import <世界名> {template}</white> 导入。'
  none: '<red>你当前没有划场地会话：<white>/taketori arena setup <场地id></white> 开始。'
  arena-gone: '<gray>该场地已被删除，这个会话收不了尾：用 <white>/taketori arena setup cancel</white> 退出会话。'
  not-ready: '<red>场地 <white>{id}</white> 还不能收尾，还缺：<gray>{missing}'
  world-not-loaded: '<red>编辑世界 <white>{world}</white> 没加载，无法写回——重新执行 <white>/taketori arena setup {id}</white> 载入编辑世界，再用 <white>/taketori arena setup done</white> 收尾。'
  done: '<green>场地 <white>{id}</white> 已完成：模板世界已写回，arenas.yml 已保存，可以开局了。'
  align-skipped: '<yellow>模板已写回，但文件夹没能对齐成 <white>moonmaps/{id}</white>（{reason}）。房间按场地 id 找模板，开局会读到 <white>moonmaps/{id}</white> 里那份地图、而不是刚划的这张——请手动处理 moonmaps/ 下的文件夹后再开局。'
  cancelled: '<yellow>已放弃场地 <white>{id}</white> 的划定会话（编辑世界仍加载着，可用 moonmap unload 保存）。'
  checklist-header: '<gold>===== 划定清单 <white>{id}</white>（世界 <white>{world}</white>）====='
  checklist-missing: '<gray>还缺：<white>{missing}'
  checklist-howto: '<dark_gray>用选区锄（arena wand）在本世界划区域，setminion/setbase/setloot/setwait/setspawn 逐项设置，每项设置后本清单会自动刷新。'
