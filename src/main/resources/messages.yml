# 文案（MiniMessage 格式）。占位符使用 {name} 形式，避免与 MiniMessage 标签冲突。
prefix: '<gradient:#f5c26b:#f78fb3><bold>竹取合战</bold></gradient> <dark_gray>»</dark_gray> '

command:
  no-permission: '<red>你没有权限执行该指令。'
  player-only: '<red>该指令只能由玩家执行。'
  reloaded: '<green>配置已重载：<white>{weapons} 把武器<green>、<white>{characters} 个角色<green>。'
  reload-failed: '<red>配置重载失败，已保留上一份可用配置：<gray>{reason}'
  unknown-sub: '<red>未知子命令。<gray>用法：/taketori <reload|give|character|debug|play>'
  usage-give: '<gray>用法：/taketori give <player> <weaponId>'
  usage-character: '<gray>用法：/taketori character <player> <characterId|none>'
  weapon-not-found: '<red>找不到武器：<white>{id}'
  character-not-found: '<red>找不到角色：<white>{id}'
  player-not-found: '<red>找不到玩家：<white>{name}'
  given: '<green>已给予 <white>{player}</white> 武器 <white>{weapon}</white>。'
  character-set: '<green>已将 <white>{player}</white> 的角色设为 <white>{character}</white>，并发放对应武器。'
  character-cleared: '<green>已清除 <white>{player}</white> 的角色绑定与武器。'
  debug-on: '<green>调试模式已开启。'
  debug-off: '<yellow>调试模式已关闭。'
  debug-locked: '<yellow>调试模式未开启，请先在 config.yml 设置 debug: true 并执行 /taketori reload。'
  debug-header: '<gray>调试信息：<white>{info}'
  debug-runtime-on: '<green>调试模式已开启（本次运行有效）。按技能时控制台会打印 <white>[input] / [skill] / [combat]</white> 三类日志。'
  debug-runtime-off: '<yellow>调试模式已关闭。'
  debug-persist: '<gray>希望重启后仍生效，请修改 config.yml 的 <white>debug: true</white>。'
  doctor-header: '<gold>===== 竹取合战 自检 ====='
  doctor-line: '<gray>{line}'
  doctor-footer: '<gold>========================='
  mode-not-weapon: '<red>主手不是插件武器，无法切换模式。'
  mode-result: '<gray>Q 槽技能结果：<white>{result}</white><gray>（SUCCESS=已切换 / NOT_BOUND=该武器没绑定 Q 技能 / ON_COOLDOWN=冷却中）'
  mode-detail: '<gray>武器 <white>{weapon}</white><gray>　当前模式 <white>{mode}</white><gray>　多模式武器：<white>{hasModes}'
  skills-header: '<gold>===== 当前武器技能 ====='
  skills-line: '<gray>{slot} <dark_gray>|</dark_gray> <white>{name}</white> <dark_gray>|</dark_gray> {state}'
  skills-footer: '<gold>========================'
  skills-empty: '<gray>主手不是插件武器（用 /taketori character 领取，或 /taketori give）。'
  qmode-usage: '<gray>用法：/taketori qmode <drop|held-slot|none>，当前：<white>{current}'
  qmode-invalid: '<red>无效的值，可选：drop / held-slot / none'
  qmode-set: '<green>Q 键行为已设为 <white>{mode}</white>（本次运行有效）。'
  qmode-persist: '<gray>永久生效请修改 config.yml 的 <white>input.q-mode</white> 后 /taketori reload。'
  play-hint: '<gray>你的角色：<white>{character}</white><gray>，武器：<white>{weapons}'

input:
  on-cooldown: '<red>{skill}</red> <gray>冷却中：<white>{time}s'
  on-cooldown-bar: '<red>{skill}</red> <gray>{bar}</gray> <white>{time}s'
  no-character: '<red>你还没有绑定角色，请联系管理员使用 /taketori character。'
  wrong-weapon: '<red>该武器不属于你的角色。'
  mode-switched: '<gray>模式：<white>{mode}</white> <dark_gray>({id})'
  equip-switched: '<gray>已切换到 <white>{weapon}</white>'
  equip-missing: '<red>你身上没有 <white>{weapon}</white>，已为你补发。'
  special-shot-on: '<aqua>特殊射击：<green>开启'
  special-shot-off: '<aqua>特殊射击：<red>关闭'

skill:
  no-target: '<gray>没有可牵引的目标。'
  mirror-ready: '<light_purple>镜面展开：<white>{time}s'
  guard-ready: '<aqua>强化防御：<white>{time}s'
  grapple-miss: '<gray>钢丝落空。'
  boost-defly: '<yellow>已取消飞行状态（飞行时推进不会生效）'
  shockwave-none: '<gray>冲击波没有命中的目标（<white>{radius}</white> 格内没有敌人）'
  freeze-applied: '<aqua>已冻结 <white>{target}</white></aqua> <gray>{time}s'
