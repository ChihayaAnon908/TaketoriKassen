# 竹取合战 · 角色定义（战斗层）
#
# 角色决定"玩家能拿到哪些武器"以及基础属性。
# weapons 的顺序同时也是发放武器时占用的快捷栏槽位顺序（config.yml 的 input.weapon-slots）。
#
# 拿两件武器的角色：用快捷栏 1 / 2 键换武器，Q 键留给"该武器自己的模式切换"。
# 拿一件武器的角色：Q 键按武器配置切换模式或切换到另一件装备。
#
# 绑定角色时会同时发一套保护 II 的铁甲（config.yml 的 loadout）。

characters:

  kaguya:
    display: '<gradient:#f5c26b:#f78fb3>辉夜</gradient>'
    weapons: [ kaguya_hammer ]
    attributes:
      max-health: 20.0
      movement-speed: 0.1
    lore:
      - '<gray>月之公主，以火箭锤开路。'

  mikado:
    display: '<dark_purple>帝</dark_purple>'
    weapons: [ mikado_konbo, mikado_odachi ]
    attributes:
      max-health: 24.0
      movement-speed: 0.1
    lore:
      - '<gray>金棒与太刀并用，近远皆可。'

  iroha:
    display: '<white>彩叶</white>'
    weapons: [ iroha_sword, iroha_wire ]
    attributes:
      max-health: 20.0
      movement-speed: 0.11
    lore:
      - '<gray>剑与钢丝并用，机动力最高。'

  noi:
    display: '<green>乃依</green>'
    weapons: [ noi_bow, noi_dagger ]
    attributes:
      max-health: 18.0
      movement-speed: 0.1
    lore:
      - '<gray>远程压制，贴脸时用短匕脱身。'

  rai:
    display: '<aqua>雷</aqua>'
    weapons: [ rai_shield, rai_banner ]
    attributes:
      max-health: 26.0
      movement-speed: 0.095
    lore:
      - '<gray>以盾为城，守中有反。'

  # 月镜与冰冻旗鱼原为"特殊装备"，现已归属八千代
  yachiyo:
    display: '<light_purple>八千代</light_purple>'
    weapons: [ moon_mirror, frozen_swordfish ]
    attributes:
      max-health: 22.0
      movement-speed: 0.1
    lore:
      - '<gray>月见之巫女，镜面反制与寒冰控制并用。'

  takumi:
    display: '<gold>宅公</gold>'
    weapons: [ takumi_fang, takumi_collar ]
    attributes:
      max-health: 24.0
      movement-speed: 0.098
    lore:
      - '<gray>忠犬本色，咬住不放，替人挡刀。'

  masami:
    display: '<gray>真实</gray>'
    weapons: [ masami_gun, masami_lens ]
    attributes:
      max-health: 20.0
      movement-speed: 0.105
    lore:
      - '<gray>远程点射与位移侦察，专打拉扯。'

  ashika:
    display: '<aqua>芦花</aqua>'
    weapons: [ ashika_reed, ashika_thread ]
    attributes:
      max-health: 19.0
      movement-speed: 0.11
    lore:
      - '<gray>身法最轻，苇叶与丝线控场。'
